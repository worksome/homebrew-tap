name: Trigger Formula

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'The lowercase name of the formula to update'
        required: true
      version:
        description: 'The version or tag of the version to update to'
        required: true
      download-url:
        description: 'The download URL to update to'
        required: true

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    steps:

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      - name: Require Tap
        run: brew tap worksome/tap

      - name: Get Tap Path
        id: tap-path
        run: |
          WORKSOME_TAP="$(brew --repo worksome/tap)"
          echo "path=${WORKSOME_TAP}" >> "$GITHUB_OUTPUT"
          echo "Tap Path: ${WORKSOME_TAP}"

      - name: Bump formula
        run: |
          brew bump-formula-pr --no-fork --no-browse --write-only --no-audit --force --url '${{ github.event.inputs.download-url }}' 'worksome/tap/${{ github.event.inputs.name }}'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_DEVELOPER: '1'

      - name: Install SSH key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          name: id_ed25519
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Set Git Remote
        working-directory: ${{ steps.tap-path.outputs.path }}
        run: git remote set-url origin 'git@github.com:worksome/homebrew-tap'

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          repository: ${{ steps.tap-path.outputs.path }}
          branch: main
          file_pattern: Formula/${{ github.event.inputs.name }}.rb
          commit_message: "chore(${{ github.event.inputs.name }}): update to version ${{ github.event.inputs.version }}"
          commit_user_name: Worksome Bot
          commit_user_email: actions@github.com
          commit_author: Worksome Bot <actions@github.com>
